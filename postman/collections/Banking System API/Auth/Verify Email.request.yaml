$kind: http-request
name: Verify Email
method: POST
url: '{{baseUrl}}/api/auth/verify-email'
order: 2000
description: Verify the user's email using the OTP sent during registration.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "otp": "123456"
    }
